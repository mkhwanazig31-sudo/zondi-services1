gin-top:10px" placeholder="🔍 Search pin..." oninput="searchPinOnMap()"></div>

<script>
let usersData={}; try{usersData=JSON.parse(localStorage.getItem('zondi_users')||'{}');}catch(e){usersData={};}
let pendingData={}; try{pendingData=JSON.parse(localStorage.getItem('zondi_pending_cache')||'{}');}catch(e){pendingData={};}
let locData={}; try{locData=JSON.parse(localStorage.getItem('zondi_patrol_cache')||'{}');}catch(e){locData={};}
let allMap=null, showLiveOnly=false, followTarget=null, myLoc=null, trails={}, markers={}, accCircles={}, lastSeen={}, mapLayers={}, lastUsersHash='', lastPendingHash='', alarmAudio=null, audioEnabled=false;
function enableAudioDev(){ if(!audioEnabled){ audioEnabled=true; try{alarmAudio=new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg'); alarmAudio.volume=0.5;}catch(e){} } }
document.addEventListener('click', enableAudioDev, {once:true}); document.addEventListener('touchstart', enableAudioDev, {once:true});
function hashObj(o){try{return JSON.stringify(o||{}).length+'-'+Object.keys(o||{}).length}catch(e){return '0-0'}}
function toggleLiveOnly(){showLiveOnly=!showLiveOnly;let b=document.getElementById('btnLive');if(b){b.textContent=showLiveOnly?'🟢 LIVE ONLY: ON':'🟢 LIVE ONLY: OFF';b.className=showLiveOnly?'btn blue small':'btn gray small';}renderMapMarkers();}
function stopFollow(){followTarget=null;}
function searchPinOnMap(){try{let q=(document.getElementById('searchMap')?.value||'').toLowerCase();if(!q)return;Object.keys(locData||{}).forEach(phone=>{let p=locData[phone];if(!p)return;if(phone.toLowerCase().includes(q)||(p.name||'').toLowerCase().includes(q)){if(p.lat&&allMap){allMap.setView([p.lat,p.lng],17);if(markers[phone])markers[phone].openPopup();}}});}catch(e){}}
function locateMeDev(){try{if(myLoc&&allMap){allMap.setView([myLoc.lat,myLoc.lng],18,{animate:true});}else if(navigator.geolocation){navigator.geolocation.getCurrentPosition(pos=>{myLoc={lat:pos.coords.latitude,lng:pos.coords.longitude}; if(allMap) allMap.setView([myLoc.lat,myLoc.lng],18);});}}catch(e){}}
function resetNorth(){try{if(allMap) allMap.setView(allMap.getCenter(), allMap.getZoom());}catch(e){}}
function toggleFullscreen(id){try{let el=document.getElementById(id); if(!document.fullscreenElement){el.requestFullscreen().catch(()=>{});}else{document.exitFullscreen();}}catch(e){}}
function switchMapTypeDev(v){try{if(!allMap) return; Object.values(mapLayers||{}).forEach(l=>{try{if(l) allMap.removeLayer(l)}catch(e){}}); if(v==='sat'){if(mapLayers.sat) mapLayers.sat.addTo(allMap); if(mapLayers.labels) mapLayers.labels.addTo(allMap);} if(v==='street'){if(mapLayers.street) mapLayers.street.addTo(allMap);} if(v==='terrain'){if(mapLayers.terrain) mapLayers.terrain.addTo(allMap);}}catch(e){}}
const APP_LINKS={'V380 Pro':{icon:'📹',pkg:'com.macrovideo.v380pro',store:'https://play.google.com/store/apps/details?id=com.macrovideo.v380pro'},'Yoosee':{icon:'👁️',pkg:'com.yoosee',store:'https://play.google.com/store/apps/details?id=com.yoosee'},'CareCamPro':{icon:'🛡️',pkg:'com.huiyun.care.viewerpro.googleplay',store:'https://play.google.com/store/apps/details?id=com.huiyun.care.viewerpro.googleplay'},'Yi IoT':{icon:'⚪',pkg:'com.kmxc.yilink',store:'https://play.google.com/store/apps/details?id=com.kmxc.yilink'},'UBox':{icon:'📦',pkg:'com.ubox',store:'https://play.google.com/store/apps/details?id=com.ubox.uboxcamera'},'V380 Mini':{icon:'🔵',pkg:'com.macrovideo.v380s',store:'https://play.google.com/store/apps/details?id=com.macrovideo.v380s'}};
async function loadLivePatrols(){try{let r=await fetch('/api/location'); if(!r.ok) return; let data=await r.json(); if(!data||typeof data!=='object') return; let newLoc={}, now=Date.now(); Object.keys(data).forEach(k=>{try{let v=data[k]; if(!v) return; let lat=parseFloat(v.lat); let lng=parseFloat(v.lng); if(isNaN(lat)||isNaN(lng)) return; newLoc[k]={...v, lat, lng}; lastSeen[k]=v.timestamp||now;}catch(e){}}); locData=newLoc; try{localStorage.setItem('zondi_patrol_cache',JSON.stringify(locData));}catch(e){} let el=document.getElementById('liveNow'); if(el) el.textContent=Object.keys(locData).length; renderMapMarkers(); checkEmergencies();}catch(e){}}
function checkEmergencies(){try{let emergencies=Object.keys(locData||{}).filter(k=>{let p=locData[k]; if(!p) return false; return p.emergency||p.sos||p.status==='sos';}); let banner=document.getElementById('emergencyBanner'), list=document.getElementById('emergencyList'), count=document.getElementById('emergencyCount'); if(!banner||!list||!count) return; if(emergencies.length>0){banner.classList.add('show'); count.textContent=emergencies.length; list.innerHTML=''; emergencies.forEach(phone=>{try{let p=locData[phone]; if(!p) return; let div=document.createElement('div'); div.style.cssText='background:#2A1515;border:1px solid #FF3B30;border-radius:8px;padding:8px;display:flex;justify-content:space-between;align-items:center'; div.innerHTML=`<div><b style="color:#fff">${(p.name||phone).toString().slice(0,30)}</b><br><small style="color:#FF3B30">🔴 ${phone}</small></div><button class="btn red small" onclick="stopEmergency('${phone.replace(/'/g,'')}')">STOP</button>`; list.appendChild(div);}catch(e){}}); if(audioEnabled&&alarmAudio){try{alarmAudio.play().catch(()=>{});}catch(e){}}}else{banner.classList.remove('show');}}catch(e){}}
async function stopEmergency(phone){try{if(!confirm('Stop emergency for '+phone+'?'))return; await fetch('/api/sos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone, action:'resolve', resolvedBy:'dev-portal'})}); await fetch('/api/location',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone, emergency:false, sos:false, status:'safe'})}); loadLivePatrols();}catch(e){}}
async function stopAllEmergencies(){try{if(!confirm('STOP ALL?'))return; for(let phone of Object.keys(locData||{})){let p=locData[phone]; if(p&&(p.emergency||p.sos)){await stopEmergency(phone);}}}catch(e){}}
async function loadFromServer(){try{let res=await fetch('/api/index'); if(!res.ok) return; let data=await res.json(); let newUsers=null; if(data&&data.users) newUsers=data.users; else if(Array.isArray(data)){let obj={}; data.forEach(item=>{try{if(typeof item==='string')obj[item]={role:'client',status:'active',name:item}; else if(item&&item.phone) obj[item.phone]=item; else if(item&&item.email) obj[item.email]=item;}catch(e){}}); newUsers=obj;} else if(data&&Object.keys(data).length>0&&!data.users&&!data.pending){newUsers=data;} if(newUsers&&Object.keys(newUsers).length>0){let h=hashObj(newUsers); if(h!==lastUsersHash){usersData=newUsers; try{localStorage.setItem('zondi_users',JSON.stringify(usersData));}catch(e){} lastUsersHash=h; renderClientsPatrols(); renderCamGrid(); let el=document.getElementById('syncStatus'); if(el) el.textContent='✅ Synced: '+Object.keys(usersData).length+' users';}} updateCounters();}catch(e){}}
async function loadPending(){try{let res=await fetch('/api/pending'); if(!res||!res.ok) res=await fetch('/api/get_pending'); if(!res||!res.ok){renderPending(); return;} let data=await res.json(); let pendingObj={}; if(Array.isArray(data)){data.forEach(item=>{try{let k=item.phone||item.email||item; if(typeof k==='string') pendingObj[k]=item; else if(item.phone) pendingObj[item.phone]=item;}catch(e){}});} else if(data&&data.pending) pendingObj=data.pending; else if(data&&typeof data==='object') pendingObj=data; pendingData=pendingObj||{}; try{localStorage.setItem('zondi_pending_cache',JSON.stringify(pendingData));}catch(e){} lastPendingHash=hashObj(pendingData); renderPending();}catch(e){renderPending();}}
function renderPending(){try{let pendDiv=document.getElementById('pending'); if(!pendDiv) return; pendDiv.innerHTML=''; let keys=Object.keys(pendingData||{}); keys.forEach(k=>{try{let u=pendingData[k]||{}; if(typeof u==='string') u={role:'patrol',status:'pending'}; let card=document.createElement('div'); card.className='card'; card.innerHTML=`<b>${k.slice(0,25)}</b><small>pending • ${u.role||'patrol'}</small><br><button class="btn gold small" onclick="approvePatrol('${k.replace(/'/g,'')}')">✓ Approve</button> <button class="btn red small" onclick="deletePatrol('${k.replace(/'/g,'')}')">Del</button>`; pendDiv.appendChild(card);}catch(e){}}); let el=document.getElementById('pPending'); if(el) el.textContent=keys.length;}catch(e){}}
function switchTab(t){try{document.querySelectorAll('.tab').forEach(e=>{try{e.classList.remove('active');}catch(er){}}); let tabEl=document.getElementById('tab-'+t); if(tabEl) tabEl.classList.add('active'); ['clients','patrols','cams','map'].forEach(v=>{let el=document.getElementById('view-'+v); if(el) el.style.display=v===t?'block':'none';}); if(t==='cams') renderCamGrid(); if(t==='map') initAllMap();}catch(e){}}
function renderCamGrid(){try{let appsDiv=document.getElementById('camApps'); if(!appsDiv) return; appsDiv.innerHTML=''; Object.keys(APP_LINKS).forEach(brand=>{try{let info=APP_LINKS[brand]; let count=0; try{count=Object.values(usersData||{}).filter(u=>u&&u.camBrand===brand).length;}catch(e){} let d=document.createElement('div'); d.className='card'; d.style.textAlign='center'; d.innerHTML=`<div style="font-size:32px">${info.icon}</div><b>${brand}</b><small>${count} clients</small><div style="display:flex;gap:4px;margin-top:6px"><button class="btn blue small" style="flex:1" onclick="openInside('${brand}')">OPEN STORE</button><button class="btn gold small" style="flex:1" onclick="openCamInApp('${brand}')">IN ZONDI</button></div>`; appsDiv.appendChild(d);}catch(e){}}); let byCam=document.getElementById('clientsByCam'); if(!byCam) return; byCam.innerHTML=''; byCam.innerHTML=`<div class="card" style="grid-column:1/-1;background:#101014;border:1px solid #272731"><b>🎥 ZONDI IN-APP CAM VIEWER</b><small style="display:block;margin-top:6px">View INSIDE Zondi, no popup block!</small><div style="display:flex;gap:6px;margin-top:10px"><input id="camUrlInput" class="search" placeholder="https://.../live.m3u8" style="margin:0;flex:1"><button class="btn blue small" onclick="playCamInApp()">▶️ PLAY</button></div><video id="zondiVideo" controls autoplay muted playsinline style="width:100%;margin-top:10px;border-radius:12px;background:#000;display:none;max-height:40vh"></video><iframe id="zondiIframe" style="width:100%;height:300px;border:none;border-radius:12px;margin-top:10px;display:none;background:#000"></iframe></div>`; Object.keys(usersData||{}).forEach(k=>{try{let u=usersData[k]; if(!u||typeof u==='string') return; if(u.role!=='client'||!u.camBrand) return; let card=document.createElement('div'); card.className='card'; card.innerHTML=`<div class="iconBox">${(APP_LINKS[u.camBrand]&&APP_LINKS[u.camBrand].icon)||'📷'}</div><b>${(u.name||k).toString().slice(0,20)}</b><small>${u.camBrand}<br>${u.camId||''}</small><div style="display:flex;gap:4px;margin-top:6px"><button class="btn blue small" style="flex:1" onclick="openInside('${u.camBrand}')">STORE</button><button class="btn gold small" style="flex:1" onclick="openCamInApp('${u.camBrand}','${k.replace(/'/g,'')}')">IN ZONDI</button></div>`; byCam.appendChild(card);}catch(e){}});}catch(e){}}
function openInside(brand){try{let info=APP_LINKS[brand]; if(!info) return; window.open(info.store,'_blank');}catch(e){}}
function openCamInApp(brand, clientKey){try{let u=clientKey?usersData[clientKey]:null; let url=u? (u.camUrl||u.rtsp||u.hls||'') : ''; if(url){let inp=document.getElementById('camUrlInput'); if(inp){inp.value=url; playCamInApp();}} else {switchTab('cams'); let inp=document.getElementById('camUrlInput'); if(inp){inp.placeholder='Enter URL for '+brand; inp.focus();}}}catch(e){}}
function playCamInApp(){try{let url=(document.getElementById('camUrlInput')?.value||'').trim(); if(!url){alert('Enter URL'); return;} let video=document.getElementById('zondiVideo'); let iframe=document.getElementById('zondiIframe'); if(!video||!iframe) return; video.style.display='none'; iframe.style.display='none'; if(url.startsWith('rtsp://')){alert('RTSP needs go2rtc proxy'); iframe.style.display='block'; iframe.src='https://github.com/AlexxIT/go2rtc'; return;} if(url.includes('.m3u8')){if(Hls.isSupported()){let hls=new Hls(); hls.loadSource(url); hls.attachMedia(video); video.style.display='block'; video.play().catch(()=>{});} else {video.style.display='block'; video.src=url; video.play().catch(()=>{});}} else {video.style.display='block'; try{video.src=url; video.play().catch(()=>{video.style.display='none'; iframe.style.display='block'; iframe.src=url;});}catch(e){iframe.style.display='block'; iframe.src=url;}}}catch(e){alert('Error: '+e.message);}}
function initAllMap(){try{setTimeout(()=>{let div=document.getElementById('allMap'); if(!div) return; if(allMap){try{allMap.invalidateSize(); renderMapMarkers();}catch(e){} return;} allMap=L.map('allMap',{zoomControl:false,maxZoom:19,minZoom:5}).setView([-25.6135,27.9852],15); let sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,maxNativeZoom:19}).addTo(allMap); let labels=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,maxNativeZoom:19}).addTo(allMap); let street=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,maxNativeZoom:19}); let terrain=L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{maxZoom:17,maxNativeZoom:17}); mapLayers={sat,street,terrain,labels}; L.control.scale({position:'bottomleft'}).addTo(allMap); if(navigator.geolocation){try{navigator.geolocation.watchPosition(p=>{myLoc={lat:p.coords.latitude,lng:p.coords.longitude};}, null, {enableHighAccuracy:true});}catch(e){}} renderMapMarkers();},300);}catch(e){}}
function renderMapMarkers(){try{if(!allMap) return; Object.values(markers||{}).forEach(m=>{try{if(m) allMap.removeLayer(m)}catch(e){}}); markers={}; Object.values(accCircles||{}).forEach(c=>{try{if(c) allMap.removeLayer(c)}catch(e){}}); accCircles={}; let now=Date.now(); Object.keys(locData||{}).forEach(phone=>{try{let p=locData[phone]; if(!p||p.lat==null) return; let lat=parseFloat(p.lat), lng=parseFloat(p.lng); if(isNaN(lat)||isNaN(lng)) return; let isEmergency=p.emergency||p.sos||p.status==='sos'; let isPatrol=p.role==='patrol'; let isOffline=(now - (lastSeen[phone]||0)) > 120000; if(isPatrol){if(!trails[phone]) trails[phone]=[]; trails[phone].push([lat,lng]); if(trails[phone].length>30) trails[phone].shift(); if(trails[phone].length>1){if(markers[phone+'_trail']) try{allMap.removeLayer(markers[phone+'_trail'])}catch(e){} try{markers[phone+'_trail']=L.polyline(trails[phone],{color:isEmergency?'#FF3B30':'#2D7FF9',weight:3,dashArray:'8 8',opacity:0.6}).addTo(allMap);}catch(e){}}} if(p.accuracy){try{accCircles[phone]=L.circle([lat,lng],{radius:parseFloat(p.accuracy)||10,color:isEmergency?'#FF3B30':(isPatrol?'#2D7FF9':'#00E676'),fillOpacity:0.12,weight:1}).addTo(allMap);}catch(e){}} let pinClass, icon; if(isOffline){pinClass='pin-grey'; icon='⚪';} else if(isEmergency){pinClass='pin-red'; icon='🆘';} else if(isPatrol){pinClass=p.status==='busy'?'pin-patrol-busy':'pin-patrol-available'; icon='🚓';} else {pinClass='pin-green'; icon='👤';} let divIcon=L.divIcon({html:`<div class="${pinClass}" id="pin-${phone}">${icon}</div>`,className:'',iconSize:[34,34],iconAnchor:[17,17]}); let statusText=isOffline?`⚪ Offline ${Math.round((now - (lastSeen[phone]||now))/60000)}m ago`: isEmergency?'🔴 EMERGENCY SOS': isPatrol?(p.status==='busy'?'🟠 Busy':'🔵 Available'):'🟢 Safe'; let popup=`<div style="min-width:180px"><b>${(p.name||phone).toString().slice(0,30)}</b><br><span style="font-size:12px;font-weight:800">${statusText}</span><br><small>${phone}<br>${lat.toFixed(6)}, ${lng.toFixed(6)}</small><br><div style="display:grid;gap:4px;margin-top:6px">${isEmergency?`<button onclick="stopEmergency('${phone.replace(/'/g,'')}')" style="background:#FF3B30;color:#fff;border:none;padding:8px;border-radius:8px;font-weight:800">🛑 STOP GREEN</button>`:''}<button onclick="followTarget='${phone.replace(/'/g,'')}'; if(allMap) allMap.setView([${lat},${lng}],17)" style="background:#2D7FF9;color:#fff;border:none;padding:8px;border-radius:8px">📍 FOLLOW</button></div></div>`; try{markers[phone]=L.marker([lat,lng],{icon:divIcon}).addTo(allMap).bindPopup(popup); if(followTarget===phone){allMap.setView([lat,lng], allMap.getZoom(), {animate:true});}}catch(e){}}catch(e){}});}catch(e){}}
function updateCounters(){try{let c=0,p=0; Object.keys(usersData||{}).forEach(k=>{let u=usersData[k]; if(!u||typeof u==='string') return; if(u.role==='client')c++; if(u.role==='patrol'&&u.status!=='pending')p++;}); let el1=document.getElementById('cTotal'); if(el1) el1.textContent=c; let el2=document.getElementById('pTotal'); if(el2) el2.textContent=p; let el3=document.getElementById('pPending'); if(el3) el3.textContent=Object.keys(pendingData||{}).length; let el4=document.getElementById('liveNow'); if(el4) el4.textContent=Object.keys(locData||{}).length;}catch(e){}}
function renderClientsPatrols(){
  try{
    let cSearch=(document.getElementById('searchClient')?.value||'').toLowerCase();
    let pSearch=(document.getElementById('searchPatrol')?.value||'').toLowerCase();
    let cDiv=document.getElementById('clients'); let pDiv=document.getElementById('patrols');
    if(!cDiv||!pDiv) return; cDiv.innerHTML=''; pDiv.innerHTML='';
    Object.keys(usersData||{}).forEach(k=>{
      try{
        let u=usersData[k]; if(!u) return; if(typeof u==='string') u={name:u,role:'client',status:'active'};
        if(u.role==='client'){
          if(cSearch&&!k.toLowerCase().includes(cSearch)&&!(u.name||'').toLowerCase().includes(cSearch)) return;
          let card=document.createElement('div'); card.className='card';
          card.innerHTML=`<div class="iconBox">👤</div><b>${(u.name||k).toString().slice(0,20)}</b><small>${(u.client_id||'').toString().slice(0,20)}<br>${k.slice(0,20)}<br>${u.camBrand||'No cam'}</small><div style="display:flex;gap:6px;margin-top:8px"><button class="btn gold small" style="flex:1" onclick="editClient('${k.replace(/'/g,'')}')">✏️ Edit</button><button class="btn red small" style="flex:1" onclick="deleteClient('${k.replace(/'/g,'')}')">🗑️ Del</button></div>`;
          cDiv.appendChild(card);
        }
        if(u.role==='patrol'&&u.status!=='pending'){
          if(pSearch&&!k.toLowerCase().includes(pSearch)) return;
          let card=document.createElement('div'); card.className='card';
          card.innerHTML=`<div class="iconBox">🚓</div><b>${k.slice(0,20)}</b><small>${(u.client_id||'').toString().slice(0,20)}</small><br><div style="display:flex;gap:6px;margin-top:6px"><button class="btn gold small" style="flex:1" onclick="editClient('${k.replace(/'/g,'')}')">✏️ Edit</button><button class="btn red small" style="flex:1" onclick="deletePatrol('${k.replace(/'/g,'')}')">Del</button></div>`;
          pDiv.appendChild(card);
        }
      }catch(e){}
    });
    updateCounters();
  }catch(e){}
}
let editingKey=null;
function editClient(key){try{let u=usersData[key]; if(!u) return; if(typeof u==='string') u={name:u,role:'client',status:'active'}; editingKey=key; document.getElementById('editTitle').innerText='✏️ Edit '+(u.role==='patrol'?'Patrol':'Client'); document.getElementById('editName').value=u.name||''; document.getElementById('editPhone').value=key; document.getElementById('editCamBrand').value=u.camBrand||''; document.getElementById('editCamId').value=u.camId||''; document.getElementById('editCamUrl').value=u.camUrl||u.rtsp||u.hls||''; document.getElementById('editModal').style.display='flex';}catch(e){}}
function closeEdit(){ document.getElementById('editModal').style.display='none'; editingKey=null; }
async function saveEdit(){try{if(!editingKey) return; let u=usersData[editingKey]||{}; if(typeof u==='string') u={role:'client',status:'active'}; u.name=document.getElementById('editName').value.trim()||editingKey; u.camBrand=document.getElementById('editCamBrand').value||''; u.camId=document.getElementById('editCamId').value.trim()||''; u.camUrl=document.getElementById('editCamUrl').value.trim()||''; if(u.camUrl){ u.rtsp=u.camUrl; u.hls=u.camUrl; } usersData[editingKey]=u; try{localStorage.setItem('zondi_users',JSON.stringify(usersData));}catch(e){} try{ await fetch('/api/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:editingKey, ...u})}); }catch(e){} closeEdit(); renderClientsPatrols(); renderCamGrid(); alert('✅ Saved '+editingKey);}catch(e){ alert('Error: '+e.message); }}
async function deleteClient(key){
  if(!confirm('Delete CLIENT '+key+'?'))return;
  // INSTANT DELETE - NO WAIT!
  delete usersData[key]; delete pendingData[key];
  try{localStorage.setItem('zondi_users',JSON.stringify(usersData)); localStorage.setItem('zondi_pending_cache',JSON.stringify(pendingData));}catch(e){}
  renderClientsPatrols(); renderPending(); renderCamGrid(); updateCounters();
  // Server in background
  fetch('/api/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:key})}).catch(()=>{});
}
async function approvePatrol(key){
  // INSTANT APPROVE
  if(pendingData[key]){usersData[key]=pendingData[key]; usersData[key].status='active'; usersData[key].role='patrol'; delete pendingData[key]; try{localStorage.setItem('zondi_users',JSON.stringify(usersData)); localStorage.setItem('zondi_pending_cache',JSON.stringify(pendingData));}catch(e){}}
  renderClientsPatrols(); renderPending(); updateCounters();
  fetch('/api/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:key})}).catch(()=>{});
}
async function deletePatrol(key){
  if(!confirm('Delete '+key+'?'))return;
  // INSTANT DELETE - NO WAIT!
  delete usersData[key]; delete pendingData[key];
  try{localStorage.setItem('zondi_users',JSON.stringify(usersData)); localStorage.setItem('zondi_pending_cache',JSON.stringify(pendingData));}catch(e){}
  renderClientsPatrols(); renderPending(); updateCounters();
  fetch('/api/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:key})}).catch(()=>{});
}
function logout(){try{sessionStorage.removeItem('zondi_dev_ok'); location.href='/login';}catch(e){}}
function startApp(){try{renderClientsPatrols(); renderPending(); renderCamGrid(); updateCounters(); loadFromServer(); loadPending(); loadLivePatrols(); setInterval(loadFromServer,15000); setInterval(loadPending,15000); setInterval(loadLivePatrols,3000);}catch(e){}}
(function(){try{if(sessionStorage.getItem('zondi_dev_ok')==='yes'){let ls=document.getElementById('lockScreen'); if(ls) ls.style.display='none'; startApp();}}catch(e){}})();
function unlockDev(){try{let p=document.getElementById('devPass').value; if(p==='zondi@123'){sessionStorage.setItem('zondi_dev_ok','yes'); let ls=document.getElementById('lockScreen'); if(ls) ls.style.display='none'; startApp();}else{let er=document.getElementById('devErr'); if(er) er.style.display='block';}}catch(e){}}
</script></body></html>
