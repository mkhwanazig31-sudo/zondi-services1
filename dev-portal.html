<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>ZONDI - Phone Dashboard</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>:root{--bg:#0A0A0B;--card:#17171D;--card2:#1F1F27;--line:#272731;--blue:#2D7FF9;--gold:#E8B62A;--green:#00E676;--red:#FF3B30;--muted:#8E8E93;--ink:#fff}*{box-sizing:border-box;font-family:Inter,system-ui}body{margin:0;background:var(--bg);color:var(--ink);padding-bottom:90px}.top{position:sticky;top:0;z-index:5000;background:rgba(10,10,11,.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--line);padding:12px 14px;display:flex;justify-content:space-between;align-items:center}.stats{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;padding:10px 12px}.sCard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}.sCard b{font-size:18px;display:block}.sCard span{font-size:9px;color:var(--muted);letter-spacing:.8px}.tabs{position:sticky;top:58px;z-index:4000;background:var(--bg);display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}.tab{padding:12px 6px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-weight:800;font-size:11px;text-align:center;cursor:pointer}.tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}.box{padding:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;cursor:pointer}.card b{font-size:13px;display:block}.card small{color:var(--muted);font-size:11px}.iconBox{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:8px;background:var(--card2);border:1px solid var(--line)}.card.live{border-color:var(--green)}.card.sos{border-color:var(--red);background:#1A0F0F}.btn{padding:10px 12px;border-radius:10px;border:none;font-weight:800;cursor:pointer;font-size:12px}.gold{background:var(--gold);color:#000}.blue{background:var(--blue);color:#fff}.red{background:var(--red);color:#fff}.gray{background:var(--card2);color:#fff;border:1px solid var(--line)}.btn.small{padding:7px 10px;font-size:11px}.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#101014;color:#fff;margin-bottom:10px}
#allMap{height:60vh;border-radius:16px;background:#101014;border:1px solid var(--line);position:relative;z-index:1}
.leaflet-top,.leaflet-bottom{z-index:400!important}
#lockScreen{position:fixed;inset:0;z-index:9999;background:#0A0A0B;display:flex;align-items:center;justify-content:center;padding:20px}
</style></head><body>
<div id="lockScreen">
  <div style="background:#17171D;border:1px solid #272731;border-radius:20px;padding:24px;width:100%;max-width:360px;text-align:center">
    <div style="font-size:32px">🔒</div>
    <h3 style="margin:10px 0">ZONDI DEV ACCESS</h3>
    <p style="color:#8E8E93;font-size:12px">Enter password</p>
    <input id="devPass" type="password" placeholder="Password" style="width:100%;padding:12px 14px;border-radius:12px;border:1px solid #272731;background:#101014;color:#fff;margin:10px 0" onkeydown="if(event.key==='Enter')unlockDev()">
    <button onclick="unlockDev()" class="btn blue" style="width:100%;padding:12px;border-radius:12px;border:none;background:#2D7FF9;color:#fff;font-weight:800">UNLOCK</button>
    <div id="devErr" style="color:#FF3B30;font-size:11px;margin-top:8px;display:none">Wrong password</div>
  </div>
</div>
<div class="top"><div><div style="font-weight:900">🛰️ ZONDI DASHBOARD</div><div style="font-size:10px;color:var(--muted)" id="syncStatus">Loading from server...</div></div><button class="btn blue small" onclick="logout()">Logout</button></div>
<div class="stats"><div class="sCard"><b id="cTotal">0</b><span>CLIENTS</span></div><div class="sCard"><b id="pTotal">0</b><span>PATROLS</span></div><div class="sCard"><b id="pPending" style="color:var(--gold)">0</b><span>PENDING</span></div><div class="sCard"><b id="liveNow" style="color:var(--green)">0</b><span>LIVE</span></div></div>
<div class="tabs"><div class="tab active" id="tab-clients" onclick="switchTab('clients')">📁 CLIENTS</div><div class="tab" id="tab-patrols" onclick="switchTab('patrols')">🚓 PATROLS</div><div class="tab" id="tab-cams" onclick="switchTab('cams')">📷 CAMS</div><div class="tab" id="tab-map" onclick="switchTab('map')">🗺️ MAP</div></div>
<div class="box" id="view-clients"><input id="searchClient" class="search" placeholder="🔍 Search client..." oninput="renderClientsPatrols()"><div class="grid" id="clients"></div></div>
<div class="box" id="view-patrols" style="display:none"><input id="searchPatrol" class="search" placeholder="🔍 Search patrol..." oninput="renderClientsPatrols()"><div class="grid" id="patrols"></div><div style="margin-top:14px"><h4>🛡️ Pending Approvals</h4><div class="grid" id="pending"></div></div></div>
<div class="box" id="view-map" style="display:none">
  <div style="display:flex;gap:8px;margin-bottom:10px">
    <button class="btn gray small" id="btnMyHouse" onclick="toggleMyHouse()" style="flex:1">🏠 MY HOUSE: OFF</button>
    <button class="btn gray small" id="btnLive" onclick="toggleLiveOnly()" style="flex:1">🟢 LIVE ONLY: OFF</button>
  </div>
  <div id="allMap"></div>
</div>
<div class="box" id="view-cams" style="display:none">
  <h4 style="margin:0 0 8px">📷 Camera Apps - Tap to Open</h4>
  <div class="grid" style="grid-template-columns:1fr 1fr 1fr" id="camApps"></div>
  <div style="margin-top:16px"><h4 style="margin:0 0 8px">🏠 Clients by Camera</h4><div class="grid" id="clientsByCam"></div></div>
</div>
<script>
let usersData=JSON.parse(localStorage.getItem('zondi_users')||'{}');
let pendingData=JSON.parse(localStorage.getItem('zondi_pending_cache')||'{}');
let locData=JSON.parse(localStorage.getItem('zondi_patrol_cache')||'{}');
let allMap = null;
let showMyHouse=false;
let showLiveOnly=false;
let myHouseMarker=null;
let lastUsersHash = JSON.stringify(usersData).length+'-'+Object.keys(usersData).length;
let lastPendingHash = JSON.stringify(pendingData).length+'-'+Object.keys(pendingData).length;
const MY_HOUSE_LAT = -25.6135;
const MY_HOUSE_LNG = 27.9852;

function hashObj(o){ try{ return JSON.stringify(o).length+'-'+Object.keys(o).length; }catch(e){ return '0-0'; } }

function toggleMyHouse(){
  showMyHouse=!showMyHouse;
  document.getElementById('btnMyHouse').textContent= showMyHouse? '🏠 MY HOUSE: ON' : '🏠 MY HOUSE: OFF';
  document.getElementById('btnMyHouse').className= showMyHouse? 'btn blue small' : 'btn gray small';
  renderMapMarkers();
  if(showMyHouse && allMap) allMap.setView([MY_HOUSE_LAT, MY_HOUSE_LNG], 16);
}
function toggleLiveOnly(){
  showLiveOnly=!showLiveOnly;
  document.getElementById('btnLive').textContent= showLiveOnly? '🟢 LIVE ONLY: ON' : '🟢 LIVE ONLY: OFF';
  document.getElementById('btnLive').className= showLiveOnly? 'btn blue small' : 'btn gray small';
  renderMapMarkers();
}
const APP_LINKS={
  'V380 Pro':{icon:'📹', pkg:'com.macrovideo.v380pro', store:'https://play.google.com/store/apps/details?id=com.macrovideo.v380pro'},
  'Yoosee':{icon:'👁️', pkg:'com.yoosee', store:'https://play.google.com/store/apps/details?id=com.yoosee'},
  'CareCamPro':{icon:'🛡️', pkg:'com.huiyun.care.viewerpro.googleplay', store:'https://play.google.com/store/apps/details?id=com.huiyun.care.viewerpro.googleplay'},
  'Yi IoT':{icon:'⚪', pkg:'com.kmxc.yilink', store:'https://play.google.com/store/apps/details?id=com.kmxc.yilink'},
  'UBox':{icon:'📦', pkg:'com.ubox', store:'https://play.google.com/store/apps/details?id=com.ubox.uboxcamera'},
  'V380 Mini':{icon:'🔵', pkg:'com.macrovideo.v380s', store:'https://play.google.com/store/apps/details?id=com.macrovideo.v380s'}
};

async function loadLivePatrols(){
  try{
    let r=await fetch('/api/location');
    let data=await r.json();
    if(data && typeof data==='object'){
      let newLoc={};
      Object.keys(data).forEach(k=>{
        let v=data[k];
        if(v.lat && v.lng) newLoc[k]={lat:parseFloat(v.lat), lng:parseFloat(v.lng),...v};
      });
      locData=newLoc;
      localStorage.setItem('zondi_patrol_cache', JSON.stringify(locData));
      document.getElementById('liveNow').textContent=Object.keys(locData).length;
      renderMapMarkers();
    }
  }catch(e){}
}

async function loadFromServer(){
  try{
    let res = await fetch('/api/index');
    let data = await res.json();
    let newUsers = null;
    if(data && data.users) newUsers = data.users;
    else if(Array.isArray(data)){
      let obj={}; data.forEach(item=>{
        let phone=item.phone||item;
        if(typeof item==='string') obj[item]={role:'client', status:'active', name:item};
        else obj[phone]=item;
      });
      newUsers=obj;
    } else if(data && Object.keys(data).length>0 && !data.users && !data.pending){
      newUsers=data;
    }
    if(newUsers && Object.keys(newUsers).length>0){
      let h=hashObj(newUsers);
      if(h!==lastUsersHash){
        usersData=newUsers;
        localStorage.setItem('zondi_users', JSON.stringify(usersData));
        lastUsersHash=h;
        renderClientsPatrols();
        renderCamGrid();
        document.getElementById('syncStatus').textContent='✅ Synced: '+Object.keys(usersData).length+' users | '+Object.keys(pendingData).length+' pending';
      }
    }
    updateCounters();
  }catch(e){
    document.getElementById('syncStatus').textContent='⚠️ Offline: '+Object.keys(usersData).length+' local';
  }
}

async function loadPending(){
  try{
    let res = await fetch('/api/pending');
    if(!res || !res.ok) res = await fetch('/api/get_pending');
    let data = await res.json();
    let pendingObj = null;
    if(Array.isArray(data)){ pendingObj={}; data.forEach(item=>{ pendingObj[item.phone||item]=item; }); }
    else if(data.pending) pendingObj=data.pending;
    else pendingObj=data;
    
    if(pendingObj && Object.keys(pendingObj).length>0){
      let h=hashObj(pendingObj);
      if(h!==lastPendingHash){
        pendingData=pendingObj;
        localStorage.setItem('zondi_pending_cache', JSON.stringify(pendingData));
        lastPendingHash=h;
        renderPending();
      }
    } else {
      renderPending();
    }
  }catch(e){ renderPending(); }
}

function renderPending(){
  let pendDiv=document.getElementById('pending');
  if(!pendDiv) return;
  pendDiv.innerHTML='';
  let keys=Object.keys(pendingData);
  keys.forEach(k=>{
    let u=pendingData[k];
    if(!u) u={role:'patrol', status:'pending'};
    let card=document.createElement('div'); card.className='card';
    card.innerHTML=`<b>${k}</b><small>pending • ${u.role||'patrol'}</small><br><button class="btn gold small" onclick="approvePatrol('${k}')">✓ Approve</button> <button class="btn red small" onclick="deletePatrol('${k}')">Del</button>`;
    pendDiv.appendChild(card);
  });
  document.getElementById('pPending').textContent=keys.length;
}

function switchTab(t){
  document.querySelectorAll('.tab').forEach(e=>e.classList.remove('active'));
  document.getElementById('tab-'+t).classList.add('active');
  document.getElementById('view-clients').style.display=t==='clients'?'block':'none';
  document.getElementById('view-patrols').style.display=t==='patrols'?'block':'none';
  document.getElementById('view-cams').style.display=t==='cams'?'block':'none';
  document.getElementById('view-map').style.display=t==='map'?'block':'none';
  if(t==='cams') renderCamGrid();
  if(t==='map') initAllMap();
}

function renderCamGrid(){
  let appsDiv=document.getElementById('camApps'); if(!appsDiv) return;
  appsDiv.innerHTML='';
  Object.keys(APP_LINKS).forEach(brand=>{
    let info=APP_LINKS[brand];
    let count=Object.values(usersData).filter(u=>u && u.camBrand===brand).length;
    let d=document.createElement('div'); d.className='card'; d.style.textAlign='center';
    d.innerHTML=`<div style="font-size:32px">${info.icon}</div><b>${brand}</b><small>${count} clients</small>`;
    d.onclick=()=>openInside(brand);
    appsDiv.appendChild(d);
  });
  let byCam=document.getElementById('clientsByCam'); if(!byCam) return;
  byCam.innerHTML='';
  Object.keys(usersData).forEach(k=>{
    let u=usersData[k]; if(!u || u.role!=='client' ||!u.camBrand) return;
    let card=document.createElement('div'); card.className='card';
    card.innerHTML=`<div class="iconBox">${APP_LINKS[u.camBrand]?.icon||'📷'}</div><b>${u.name||k}</b><small>${u.camBrand}<br>${u.camId||''}</small><button class="btn blue small" style="width:100%;margin-top:8px" onclick="openInside('${u.camBrand}','${k}')">📱 OPEN</button>`;
    byCam.appendChild(card);
  });
}
function openInside(brand, clientKey){
  let info=APP_LINKS[brand]; if(!info) return;
  window.location.href=`intent://#Intent;package=${info.pkg};end`;
  setTimeout(()=>{ window.open(info.store,'_blank'); },1200);
}
function initAllMap(){
  setTimeout(()=>{
    let div=document.getElementById('allMap'); if(!div) return;
    if(allMap){ allMap.invalidateSize(); renderMapMarkers(); return; }
    allMap = L.map('allMap').setView([MY_HOUSE_LAT, MY_HOUSE_LNG], 15);
    let sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'© Esri Satellite', maxZoom:19}).addTo(allMap);
    let labels = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}').addTo(allMap);
    let street = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OSM'});
    L.control.layers({"🛰️ Satellite - Real Houses": sat, "🗺️ Street": street}, null, {position:'bottomright'}).addTo(allMap);
    renderMapMarkers();
  },300);
}
function renderMapMarkers(){
  if(!allMap) return;
  allMap.eachLayer(layer=>{ if(layer instanceof L.Marker) allMap.removeLayer(layer); });
  if(myHouseMarker){ try{allMap.removeLayer(myHouseMarker);}catch(e){} myHouseMarker=null; }
  if(showMyHouse){
    myHouseMarker=L.marker([MY_HOUSE_LAT, MY_HOUSE_LNG], {icon: L.divIcon({html:'🏠', className:'', iconSize:[30,30]})}).addTo(allMap).bindPopup('<b>MY HOUSE</b><br>🏠 Ga-Rankuwa Unit 20').openPopup();
  }
  Object.keys(usersData).forEach(k=>{
    let u=usersData[k]; if(!u || u.role!=='client') return;
    if(showLiveOnly) return;
    let lat=u.lat||u.latitude; let lng=u.lng||u.lon||u.longitude;
    if(lat && lng){
      L.marker([parseFloat(lat), parseFloat(lng)]).addTo(allMap).bindPopup(`<b>${u.name||k}</b><br>${k}`);
    }
  });
  Object.keys(locData).forEach(k=>{
    let p=locData[k]; if(!p ||!p.lat) return;
    L.marker([p.lat, p.lng], {icon: L.divIcon({html:'🚓', className:'', iconSize:[20,20]})}).addTo(allMap).bindPopup(`<b>${k}</b><br>🚓 Live`);
  });
}

function updateCounters(){
  let cCount=0,pCount=0;
  Object.keys(usersData).forEach(k=>{
    let u=usersData[k]; if(!u) return;
    if(u.role==='client') cCount++;
    if(u.role==='patrol' && u.status!=='pending') pCount++;
  });
  document.getElementById('cTotal').textContent=cCount;
  document.getElementById('pTotal').textContent=pCount;
  document.getElementById('pPending').textContent=Object.keys(pendingData).length;
  document.getElementById('liveNow').textContent=Object.keys(locData).length;
}

function renderClientsPatrols(){
  let cSearch=(document.getElementById('searchClient')?.value||'').toLowerCase();
  let pSearch=(document.getElementById('searchPatrol')?.value||'').toLowerCase();
  let cDiv=document.getElementById('clients'); 
  let pDiv=document.getElementById('patrols');
  if(!cDiv || !pDiv) return;
  cDiv.innerHTML=''; pDiv.innerHTML='';
  Object.keys(usersData).forEach(k=>{
    let u=usersData[k]; if(!u) return;
    if(typeof u==='string') u={name:u, role:'client', status:'active'};
    if(u.role==='client'){
      if(cSearch && !k.toLowerCase().includes(cSearch) && !(u.name||'').toLowerCase().includes(cSearch)) return;
      let card=document.createElement('div'); card.className='card';
      card.innerHTML=`<div class="iconBox">👤</div><b>${u.name||k}</b><small>${u.client_id||''}<br>${k}</small>`;
      cDiv.appendChild(card);
    }
    if(u.role==='patrol' && u.status!=='pending'){
      if(pSearch && !k.toLowerCase().includes(pSearch)) return;
      let card=document.createElement('div'); card.className='card';
      card.innerHTML=`<div class="iconBox">🚓</div><b>${k}</b><small>${u.client_id||''}</small><br><button class="btn red small" onclick="deletePatrol('${k}')">Delete</button>`;
      pDiv.appendChild(card);
    }
  });
  updateCounters();
}

function render(){ renderClientsPatrols(); renderCamGrid(); } // legacy support

async function approvePatrol(key){
  await fetch('/api/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:key})});
  if(pendingData[key]){
    usersData[key]=pendingData[key];
    usersData[key].status='active';
    usersData[key].role='patrol';
    delete pendingData[key];
    localStorage.setItem('zondi_users', JSON.stringify(usersData));
    localStorage.setItem('zondi_pending_cache', JSON.stringify(pendingData));
    lastUsersHash=hashObj(usersData);
    lastPendingHash=hashObj(pendingData);
  }
  renderClientsPatrols(); renderPending(); loadFromServer();
}
async function deletePatrol(key){
  if(!confirm('Delete '+key+'?')) return;
  await fetch('/api/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:key})});
  delete usersData[key];
  delete pendingData[key];
  localStorage.setItem('zondi_users', JSON.stringify(usersData));
  localStorage.setItem('zondi_pending_cache', JSON.stringify(pendingData));
  lastUsersHash=hashObj(usersData);
  lastPendingHash=hashObj(pendingData);
  renderClientsPatrols(); renderPending(); loadFromServer();
}
function logout(){
  sessionStorage.removeItem('zondi_dev_ok');
  location.href='/login';
}
function startApp(){
  renderClientsPatrols(); renderPending(); renderCamGrid(); updateCounters();
  loadFromServer(); loadPending(); loadLivePatrols();
  setInterval(loadFromServer, 15000);
  setInterval(loadPending, 15000);
  setInterval(loadLivePatrols, 5000);
}
// INIT
(function(){
  if(sessionStorage.getItem('zondi_dev_ok')==='yes'){
    document.getElementById('lockScreen').style.display='none';
    startApp();
  }
})();
function unlockDev(){
  let p=document.getElementById('devPass').value;
  if(p==='zondi@123'){
    sessionStorage.setItem('zondi_dev_ok','yes');
    document.getElementById('lockScreen').style.display='none';
    startApp();
  } else {
    document.getElementById('devErr').style.display='block';
  }
}
</script></body></html>
