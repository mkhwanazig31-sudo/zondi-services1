<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Control Room - ZONDI</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>:root{--bg:#F9F7F2;--card:#fff;--gold:#E8B62A;--blue:#2D7FF9;--line:#EDE8E0;--ink:#121212;--muted:#8A857E}*{box-sizing:border-box;font-family:Inter}body{margin:0;background:var(--bg);color:var(--ink)}#top{background:var(--ink);color:#fff;padding:12px 16px;display:flex;justify-content:space-between}#map{height:58vh;border-bottom:2px solid var(--gold)}.wrap{padding:16px}table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}td,th{padding:10px;font-size:13px;border-bottom:1px solid var(--line);text-align:left}th{background:#FFFEFB;color:var(--muted);font-size:11px;letter-spacing:1px}.footer{text-align:center;padding:22px;color:#999;font-size:10px;letter-spacing:1.2px;text-transform:uppercase}</style>
<script>
// --- NEW: AUTH GUARD - CONTROL ROOM ONLY - ADDED WITHOUT TOUCHING MAP ---
let role = localStorage.getItem('zondi_role');
let user = localStorage.getItem('zondi_user');
if(!user){ location.href='/login'; }
if(role!=='dev'){ alert('Control Room access only'); location.href='/login'; }
</script>
</head><body>
<div id="top"><b style="color:var(--gold)">ZONDI CONTROL ROOM</b><span onclick="location.href='/'" style="cursor:pointer;color:#999;font-size:13px">HOME</span></div>
<div id="map"></div>
<div class="wrap"><h3 style="margin:0 0 4px">All Live Units</h3><div id="count" style="color:var(--muted);font-size:13px;margin-bottom:10px">0 online</div>
<table><thead><tr><th>ID</th><th>Last Seen</th><th>Location</th></tr></thead><tbody id="tbody"></tbody></table></div>
<div class="footer">designed by mkhwanazi.gv — built with autonomous intelligence, directed by human intent<br><span style="font-size:9px;opacity:.6">COMMAND CENTER • GA-RANKUWA</span></div>
<script>
let map=L.map('map').setView([-26.2041,28.0473],11);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);let markers={};
async function refresh(){let r=await fetch('/get_clients');let d=await r.json();document.getElementById('count').innerText=Object.keys(d).length+' units LIVE';let tb=document.getElementById('tbody');tb.innerHTML='';for(let u in d){let l=d[u];let pos=[l.lat,l.lng];if(!markers[u])markers[u]=L.marker(pos).addTo(map).bindPopup(u);else markers[u].setLatLng(pos);tb.innerHTML+=`<tr><td><b>${u}</b></td><td>${l.time}</td><td>${l.lat.toFixed(4)}, ${l.lng.toFixed(4)}</td></tr>`;}}
setInterval(refresh,2000);refresh();
</script></body></html>
