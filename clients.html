<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Client Portal - ZONDI</title>
<style>:root{--bg:#F9F7F2;--card:#fff;--ink:#121212;--blue:#2D7FF9;--line:#EDE8E0;--muted:#8A857E}*{box-sizing:border-box;font-family:Inter}body{margin:0;background:var(--bg);color:var(--ink);padding:20px}.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}.btn{padding:12px;border-radius:10px;border:none;font-weight:700;cursor:pointer;width:100%}.blue{background:var(--blue);color:#fff}</style>
<script>
// AUTH GUARD
let role=localStorage.getItem('zondi_role');
if(role!=='client' && role!=='dev'){ location.href='/login'; }
</script>
</head><body>
<h2>🛡️ Client Protection</h2>
<p style="color:#8A857E;font-size:13px">ID: <span id="cid"></span></p>
<div class="box"><h3>Request Patrol</h3><button class="btn blue">🚨 SOS Panic</button><p style="font-size:12px;color:#8A857E;margin-top:8px">Patrol unit will be dispatched to your live GPS</p></div>
<div class="box"><button class="btn" style="background:#fff;border:1px solid #EDE8E0" onclick="localStorage.clear();location.href='/login'">Logout</button></div>
<script>document.getElementById('cid').innerText=localStorage.getItem('zondi_client_id')||localStorage.getItem('zondi_user');</script>
</body></html>
