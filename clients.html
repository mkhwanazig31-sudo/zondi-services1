<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Client - ZONDI</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>:root{--bg:#F9F7F2;--card:#fff;--gold:#E8B62A;--blue:#2D7FF9;--line:#EDE8E0;--muted:#8A857E}*{box-sizing:border-box;font-family:Inter}body{margin:0;background:var(--bg);padding:20px;display:flex;flex-direction:column;align-items:center}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:10px 0;width:100%;max-width:380px;box-shadow:0 8px 30px rgba(0,0,0,.06);text-align:center}#qr{background:#fff;padding:12px;border-radius:12px;display:inline-block;margin:10px}.footer{text-align:center;padding:24px;color:#999;font-size:10px;letter-spacing:1.2px;text-transform:uppercase;margin-top:auto}</style></head><body>
<h2 style="color:var(--ink)">Client Portal</h2><div class="card"><div id="status">📍 Starting GPS...</div><div id="coords" style="color:var(--muted);font-size:12px">Waiting</div></div>
<div class="card"><b>Your QR ID</b><div id="qr"></div><div id="myId" style="color:var(--blue);font-weight:800"></div></div>
<button onclick="location.href='/'" style="width:100%;max-width:380px;padding:12px;border-radius:20px;border:1px solid var(--line);background:var(--card)">Home</button>
<div class="footer">designed by mkhwanazi.gv — built with autonomous intelligence, directed by human intent</div>
<script>let myId=localStorage.getItem('zondi_user')||'ZONDI-'+Math.floor(Math.random()*9000+1000);localStorage.setItem('zondi_user',myId);document.getElementById('myId').innerText=myId;new QRCode(document.getElementById("qr"),{text:myId,width:160,height:160});setInterval(()=>{navigator.geolocation.getCurrentPosition(p=>{fetch('/update_location',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:myId,lat:p.coords.latitude,lng:p.coords.longitude})});document.getElementById('status').innerText='● LIVE TRACKING';document.getElementById('coords').innerText=p.coords.latitude.toFixed(5)+', '+p.coords.longitude.toFixed(5)},()=>{document.getElementById('status').innerText='⚠️ Allow Location';});},3000);</script></body></html>
