<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Patrol - ZONDI</title>
<style>:root{--bg:#0F0F0F;--card:#1A1A1A;--ink:#fff;--blue:#2D7FF9;--line:#2A2A2A;--muted:#8A857E}*{box-sizing:border-box;font-family:Inter}body{margin:0;background:var(--bg);color:var(--ink);padding:20px}.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}.btn{padding:12px;border-radius:10px;border:none;font-weight:700;cursor:pointer;width:100%}.blue{background:var(--blue);color:#fff}</style>
<script>
let role=localStorage.getItem('zondi_role');
if(role!=='patrol' && role!=='dev'){ location.href='/login'; }
</script>
</head><body>
<h2>🚓 Patrol Unit</h2>
<p style="color:#8A857E;font-size:13px">Unit: <span id="uid"></span></p>
<div class="box"><h3>📍 Status: ON DUTY</h3><p style="font-size:12px;color:#8A857E">GPS sharing active</p><div id="map" style="height:250px;background:#111;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#555">Map here</div></div>
<div class="box"><button class="btn" style="background:#1A1A1A;border:1px solid #2A2A2A;color:#fff" onclick="localStorage.clear();location.href='/login'">Logout</button></div>
<script>document.getElementById('uid').innerText=localStorage.getItem('zondi_user');</script>
</body></html>
