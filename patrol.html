<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Patrol - ZONDI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>:root{--bg:#0B0B0F;--card:#17171D;--card2:#1F1F27;--line:#272731;--blue:#2D7FF9;--gold:#E8B62A;--green:#00E676;--red:#FF453A;--muted:#8E8E93;--ink:#fff}*{box-sizing:border-box;font-family:Inter,system-ui}body{margin:0;background:var(--bg);color:var(--ink);padding:0 0 90px}
.top{position:sticky;top:0;z-index:1000;background:rgba(11,11,15,.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
.logo{width:38px;height:38px;border-radius:10px;object-fit:cover;background:#000;border:1px solid var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;margin:12px 14px;padding:14px}
#map{height:54vh;width:100%;background:#101014}
.fab{position:absolute;top:90px;right:12px;z-index:500;background:#fff;color:#000;border-radius:12px;padding:10px 12px;font-weight:800;font-size:12px;border:none;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.fab2{position:absolute;top:90px;left:12px;z-index:500;background:#1F1F27;color:#fff;border:1px solid #333;border-radius:12px;padding:10px 12px;font-weight:700;font-size:11px;cursor:pointer}
.listItem{display:flex;justify-content:space-between;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0;cursor:pointer}
.tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(23,23,29,.95);backdrop-filter:blur(20px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:10px 6px 22px;z-index:2000}
.tab{flex:1;text-align:center;font-size:10px;color:var(--muted);font-weight:700}.tab.active{color:var(--ink)}.tab b{font-size:20px;display:block;margin-bottom:2px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}.green{background:var(--green);box-shadow:0 0 10px var(--green)}.red{background:var(--red);box-shadow:0 0 10px var(--red)}
.pin{width:36px;height:48px;display:flex;flex-direction:column;align-items:center;filter:drop-shadow(0 6px 12px rgba(0,0,0,.8))}
.pin-head{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;border:2px solid #fff;color:#fff;font-weight:900;font-size:13px}
.pin-head span{transform:rotate(45deg)}.pin-label{background:#0B0B0F;color:#fff;padding:4px 8px;border-radius:10px;font-size:9px;font-weight:800;border:1px solid #2A2A2A;white-space:nowrap;margin-top:4px}
.sos-bounce{animation:bounce 0.7s infinite} @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.btn{padding:12px 16px;border-radius:14px;border:none;font-weight:800;cursor:pointer}.blue{background:var(--blue);color:#fff}.gray{background:var(--card2);color:#fff;border:1px solid var(--line)}
.app-drawer{position:fixed;inset:0;z-index:5000;background:rgba(8,8,10,.98);backdrop-filter:blur(30px);display:none;flex-direction:column;padding:20px 16px 100px;overflow-y:auto}
.app-drawer.open{display:flex}
.drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.grid-size{display:flex;gap:8px;background:#17171D;border:1px solid #272731;border-radius:20px;padding:4px}
.grid-size button{padding:6px 12px;border-radius:14px;border:none;background:transparent;color:#8E8E93;font-weight:800;font-size:11px;cursor:pointer}
.grid-size button.active{background:#fff;color:#000}
.app-grid{display:grid;gap:18px;transition:.2s}
.app-grid.grid-4{grid-template-columns:repeat(4,1fr)}
.app-grid.grid-5{grid-template-columns:repeat(5,1fr)}
.app-grid.grid-6{grid-template-columns:repeat(6,1fr)}
.app-icon{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer}
.app-icon.icon{width:58px;height:58px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:26px;background:var(--card2);border:1px solid var(--line);box-shadow:0 8px 20px rgba(0,0,0,.3);transition:.15s}
.app-icon:active.icon{transform:scale(0.9)}
.app-icon b{font-size:10px;font-weight:700;color:#fff;text-align:center;letter-spacing:.3px}
.app-icon small{font-size:9px;color:var(--muted);margin-top:-4px}
.fab-grid{position:fixed;bottom:90px;right:14px;z-index:4000;width:56px;height:56px;border-radius:18px;background:#fff;color:#000;border:none;font-size:24px;font-weight:900;box-shadow:0 12px 30px rgba(0,0,0,.5);cursor:pointer}
</style>
<script>let role=localStorage.getItem('zondi_role');let uid=localStorage.getItem('zondi_user')||'PATROL-UNIT';if(role!=='patrol'&&role!=='dev'){location.href='/login'}</script>
</head><body>
<div class="top"><div style="display:flex;align-items:center;gap:10px"><img class="logo" src="/logo.png" onerror="this.src='https://via.placeholder.com/38'"><div><div style="font-weight:900;font-size:13px">ZONDI PATROL</div><div style="font-size:10px;color:var(--muted)" id="uid">UNIT</div></div></div><div style="font-size:10px;padding:6px 10px;border-radius:20px;background:#1A2A1A;color:var(--green);border:1px solid #1F3A1F"><span class="dot green"></span> ON DUTY • LIVE</div></div>

<div id="view-map"><div style="position:relative"><div id="map"></div><button class="fab2" id="followBtn" style="top:12px;left:12px">📍 Follow: ON</button>
<button class="fab" id="locateBtn" style="top:12px;right:12px;background:#17171D;color:#fff;border:1px solid #333" onclick="locateMe()">🎯 Me</button>
<button class="fab" id="zoomInBtn" style="top:120px;right:12px;bottom:auto">➕</button>
<button class="fab" id="zoomOutBtn" style="top:160px;right:12px;bottom:auto">➖</button>
<div id="targetInfo" style="position:absolute;top:50px;left:12px;right:12px;z-index:1000;background:#15151A;border:1px solid #272731;border-radius:14px;padding:10px;display:none"><b id="targetName">Target</b><br><small id="targetDist" style="color:#8E8E93">Calculating...</small><button onclick="clearTarget()" style="float:right;background:#FF453A;color:#fff;border:none;border-radius:8px;padding:4px 8px;font-size:10px">✕ Clear</button></div>
<div id="navBar" style="position:absolute;bottom:14px;left:12px;right:12px;z-index:1000;display:flex;gap:8px"><button class="btn blue" style="flex:1" onclick="navGoogle()">🗺️ Google</button><button class="btn gray" style="flex:1;background:#33CCFF;color:#000" onclick="navWaze()">🚗 Waze</button><button class="btn gray" style="flex:1" onclick="navInApp()">📍 Route</button></div>
</div>
<div class="card"><div style="display:flex;justify-content:space-between"><b id="activeTitle">Active Tracking</b><span style="font-size:11px;color:var(--muted)" id="lastUpdate">--</span></div><div id="activeClient" style="margin-top:8px;font-size:13px;color:var(--muted)">📡 Waiting for client location...</div><div id="sosActions" style="display:none;margin-top:10px"><button class="btn blue" style="width:100%" onclick="resolveSOS()">✅ Resolve SOS - Clear Alert</button></div></div></div>

<div id="view-clients" style="display:none"><div class="card"><b>📍 Live Clients</b><small style="color:var(--muted);display:block;margin-top:4px">🔵 Client • 🔴 SOS • Tap to navigate</small><div id="clientList" style="margin-top:12px"></div><div id="sosList" style="margin-top:12px"></div></div></div>
<div id="view-about" style="display:none"><div class="card" style="padding:0;overflow:hidden"><img src="/about.png" style="width:100%;display:block"><div style="padding:14px"><div style="display:flex;align-items:center;gap:10px;margin-bottom:10px"><img src="/logo.png" class="logo"><b>ZONDI PATROL SERVICE</b></div><p style="color:var(--muted);font-size:12px;line-height:1.6">VIGILANT. DISCIPLINED. DEDICATED.<br>YOUR SAFETY IS OUR MISSION<br><br>📞 071 536 3253 • 074 774 3521</p></div></div></div>
<div class="tabs"><div class="tab active" id="tab-map" onclick="switchTab('map',this)"><b>🗺️</b>MAP</div><div class="tab" onclick="switchTab('clients',this)"><b>📍</b>CLIENTS</div><div class="tab" onclick="switchTab('about',this)"><b>🦁</b>ABOUT</div></div>

<script>
document.getElementById('uid').innerText=uid;
let map=L.map('map',{zoomControl:false}).setView([-25.7479,28.2293],18);
L.control.zoom({position:'bottomright'}).addTo(map);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:22}).addTo(map);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png',{maxZoom:22,opacity:.85}).addTo(map);
let markers={}, currentId=null, currentData=null, follow=true, myLoc=null, lastSOSId=null, lastSOSTime=0;
let saved=JSON.parse(localStorage.getItem('zondi_patrol_cache')||'{}');
function saveCache(l){Object.assign(saved,l);localStorage.setItem('zondi_patrol_cache',JSON.stringify(saved));}
map.on('dragstart',()=>{follow=false;document.getElementById('followBtn').innerText='📍 Follow: OFF';});
document.getElementById('followBtn').onclick=()=>{follow=true;document.getElementById('followBtn').innerText='📍 Follow: ON'; if(currentData) map.setView([currentData.lat,currentData.lng],20);};
navigator.geolocation.watchPosition(p=>{myLoc={lat:p.coords.latitude,lng:p.coords.longitude};},null,{enableHighAccuracy:true});
let activeTarget=null, routingLine=null;
function getDistance(lat1,lon1,lat2,lon2){const R=6371;const dLat=(lat2-lat1)*Math.PI/180;const dLon=(lon2-lon1)*Math.PI/180;const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));}
function setNavigationTarget(lat,lng,name='Client'){
  activeTarget={lat,lng,name};
  document.getElementById('targetInfo').style.display='block';
  document.getElementById('targetName').innerText='🎯 '+name;
  if(myLoc){let d=getDistance(myLoc.lat,myLoc.lng,lat,lng); document.getElementById('targetDist').innerText=`${d.toFixed(2)} km • ~${Math.max(1,Math.round(d*2.5))} min drive • Tap Google/Waze`;}
  else document.getElementById('targetDist').innerText=`📍 ${lat.toFixed(6)}, ${lng.toFixed(6)} • Tap Google/Waze to navigate`;
  navInApp();
}
function clearTarget(){
  activeTarget=null;
  document.getElementById('targetInfo').style.display='none';
  if(routingLine){ map.removeLayer(routingLine); routingLine=null; }
  currentId=null; currentData=null;
  document.getElementById('activeTitle').innerText='Active Tracking';
  document.getElementById('activeClient').innerHTML='📡 No target - tap a client';
  document.getElementById('sosActions').style.display='none';
}
function locateMe(){
  if(!myLoc) return alert('Waiting for your GPS...');
  follow=true;
  document.getElementById('followBtn').innerText='📍 Follow: ON';
  map.setView([myLoc.lat,myLoc.lng],19,{animate:true});
}
document.getElementById('zoomInBtn').onclick = ()=> map.zoomIn();
document.getElementById('zoomOutBtn').onclick = ()=> map.zoomOut();
setTimeout(locateMe, 2000);
function navGoogle(){ if(!activeTarget) return alert('Tap a client first'); window.open(`https://www.google.com/maps/dir/?api=1&destination=${activeTarget.lat},${activeTarget.lng}&travelmode=driving`,'_blank'); }
function navWaze(){ if(!activeTarget) return alert('Tap a client first'); window.open(`https://waze.com/ul?ll=${activeTarget.lat},${activeTarget.lng}&navigate=yes`,'_blank'); }
function navInApp(){
  if(!activeTarget) return;
  if(routingLine) map.removeLayer(routingLine);
  let start = myLoc? [myLoc.lat,myLoc.lng] : [activeTarget.lat, activeTarget.lng];
  routingLine = L.polyline([start,[activeTarget.lat,activeTarget.lng]],{color:'#2D7FF9',weight:5,dashArray:'10,10'}).addTo(map);
  map.fitBounds(routingLine.getBounds(),{padding:[60,60]});
}
function upsert(e){
  if(!e ||!e.lat ||!e.lng) return;
  // FIX undefined
  e.client_id = e.client_id || e.phone || e.email || 'Unknown';
  e.name = e.name || e.client_id.split('@')[0] || e.phone || 'Client';
  e.phone = e.phone || e.email || e.client_id;
  e.accuracy = e.accuracy || e.acc || '?';
  // FIX Invalid Date - handle seconds and ms
  let ts = e.ts || e.time || Date.now();
  if(ts < 1e12) ts = ts * 1000; // seconds to ms
  e.ts = ts;

  let latlng=[parseFloat(e.lat),parseFloat(e.lng)];
  let isSOS=!!e.sos;
  let color=isSOS?'#FF453A':'#2D7FF9';
  let label=(e.name||'C').slice(0,12);
  let html=`<div class="pin ${isSOS?'sos-bounce':''}"><div class="pin-head" style="background:${color}"><span>${isSOS?'!':label.charAt(0).toUpperCase()}</span></div><div class="pin-label" style="background:${isSOS?'#FF453A':'#0B0B0F'}">${label} • ±${e.accuracy}m</div></div>`;
  let icon=L.divIcon({html:html,className:'',iconSize:[40,56],iconAnchor:[20,48]});
  if(!markers[e.client_id]){
    markers[e.client_id]=L.marker(latlng,{icon:icon}).addTo(map).on('click',()=>{
      setNavigationTarget(e.lat,e.lng,e.name); currentId=e.client_id; currentData=e;
    });
  } else {
    markers[e.client_id].setLatLng(latlng); markers[e.client_id].setIcon(icon);
  }
  markers[e.client_id].bindPopup(`<div style="font-family:Inter"><b>${isSOS?'🚨 SOS — ':''}${e.name}</b><br>📞 ${e.phone}<br>📍 ${e.lat.toFixed(7)}, ${e.lng.toFixed(7)}<br>🎯 ±${e.accuracy}m<br><button onclick="setNavigationTarget(${e.lat},${e.lng},'${e.name}')" style="margin-top:6px;padding:6px 10px;border-radius:8px;background:#2D7FF9;color:#fff;border:none">Navigate</button></div>`);

  if(!currentId || e.client_id===currentId){
    document.getElementById('activeTitle').innerHTML=isSOS?`🚨 SOS — ${e.name}`:`📍 LIVE — ${e.name}`;
    document.getElementById('activeClient').innerHTML=`<span class="dot ${isSOS?'red':'green'}"></span> <b>${e.phone}</b> • ${e.client_id}<br>👤 ${e.name}<br>📍 ${e.lat.toFixed(7)}, ${e.lng.toFixed(7)}<br>🎯 ±${e.accuracy}m<br>🕒 ${new Date(e.ts).toLocaleTimeString()}`;
    document.getElementById('lastUpdate').innerText=new Date(e.ts).toLocaleTimeString();
    currentId=e.client_id; currentData=e;
    if(follow) map.panTo(latlng,{animate:true});
  }
}
async function fetchLive(){
  try{
    let r=await fetch('/api/location');
    let locs=await r.json();
    let local=localStorage.getItem('zondi_last_loc');
    if(local){
      try{ let j=JSON.parse(local); if(j.client_id) locs[j.client_id]=j; }catch(e){}
    }
    saveCache(locs);
    let all=Object.keys(locs).length? locs : saved;
    let entries=Object.values(all).sort((a,b)=> (b.ts||0)-(a.ts||0));
    let list=document.getElementById('clientList');
    list.innerHTML='';
    if(entries.length===0){
      list.innerHTML='<div style="color:#8E8E93;font-size:12px;padding:12px">No live clients yet. Clients must open app and share location.</div>';
      if(!currentId) document.getElementById('activeClient').innerHTML='📡 Waiting for client location...';
      return;
    }
    entries.forEach(e=>{
      if(!e.lat ||!e.lng) return;
      if(e.sos) return; // SOS handled separately
      upsert(e);
      list.innerHTML+=`<div class="listItem" onclick="setNavigationTarget(${e.lat},${e.lng},'${e.name||e.client_id}');currentId='${e.client_id}';currentData={lat:${e.lat},lng:${e.lng}};follow=true;map.setView([${e.lat},${e.lng}],20);switchTab('map',document.getElementById('tab-map'))"><div><b>📍 ${e.name||e.client_id}</b><br><small style="color:var(--muted)">${e.phone||''} • ±${e.accuracy||e.acc||'?'}m</small></div><span class="dot green"></span></div>`;
    });
  }catch(e){
    console.log('fetchLive error', e);
  }
}
async function fetchSOS(){
  try{
    let r=await fetch('/api/sos');
    let alerts=await r.json();
    if(!Array.isArray(alerts)) alerts = alerts? Object.values(alerts) : [];
    // FIXED: Filter old SOS >15 min, and only show newest per client to stop jumping
    let now = Date.now()/1000;
    alerts = alerts.filter(a=>{
      let ts = a.ts || a.time || 0;
      if(typeof ts === 'string') ts = parseFloat(ts) || 0;
      // Keep if within 15 min (900 sec) or if no ts (show for 5 min)
      return (now - ts) < 900 || ts===0;
    });
    // Deduplicate - keep newest per phone
    let byPhone={};
    alerts.forEach(a=>{
      let phone = (a.phone||a.email||'').toLowerCase();
      if(!byPhone[phone] || (a.ts||0) > (byPhone[phone].ts||0)){
        byPhone[phone]=a;
      }
    });
    let unique = Object.values(byPhone).sort((a,b)=>(b.ts||0)-(a.ts||0));
    // Only show max 1 SOS at a time to prevent jumping
    let sosDiv=document.getElementById('sosList');
    sosDiv.innerHTML='';
    if(unique.length===0){
      if(document.getElementById('activeTitle').innerText.includes('SOS')){
        // If SOS expired, clear active
        if((now - lastSOSTime) > 900){
          clearTarget();
          document.getElementById('activeClient').innerHTML='✅ All clear - No active SOS';
        }
      }
      return;
    }
    let latest = unique[0];
    latest.sos=true;
    // Show banner for latest SOS only
    sosDiv.innerHTML=`<div style="background:#FF453A;color:#fff;border-radius:14px;padding:12px;margin:8px 0"><b>🚨 SOS ACTIVE - ${latest.name||latest.phone||latest.client_id}</b><br><small>${latest.phone||''} • ${new Date((latest.ts||0)*1000).toLocaleTimeString()}</small><br><button class="btn blue" style="margin-top:8px;width:100%" onclick="setNavigationTarget(${latest.lat},${latest.lng},'${latest.name||latest.client_id}');currentId='${latest.phone||latest.client_id}';follow=true;map.setView([${latest.lat},${latest.lng}],19)">🎯 Navigate to SOS</button></div>`;

    // Auto-set navigation to latest SOS only if no current target or newer than last
    if(!currentId || (latest.ts||0) > lastSOSTime){
      upsert({...latest, client_id: latest.phone||latest.client_id||latest.email, lat: parseFloat(latest.lat), lng: parseFloat(latest.lng), ts: (latest.ts||0)*1000 });
    }
  }catch(e){ console.log('fetchSOS error', e); }
}
async function resolveSOS(){
  if(!currentId &&!lastSOSId) return;
  let phone = currentId || lastSOSId;
  try{
    await fetch('/api/sos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'clear', phone: phone})});
    clearTarget();
    document.getElementById('activeClient').innerHTML='✅ SOS Resolved - Alert cleared';
    lastSOSId=null; lastSOSTime=0;
    fetchSOS();
  }catch(e){ alert('Failed to clear: '+e); }
}
function switchTab(t,el){
  document.querySelectorAll('.tab').forEach(e=>e.classList.remove('active'));
  if(el) el.classList.add('active');
  else document.getElementById('tab-'+t).classList.add('active');
  document.getElementById('view-map').style.display=t==='map'?'block':'none';
  document.getElementById('view-clients').style.display=t==='clients'?'block':'none';
  document.getElementById('view-about').style.display=t==='about'?'block':'none';
  if(t==='map') setTimeout(()=>map.invalidateSize(),300);
}
setInterval(()=>{ fetchLive(); fetchSOS(); }, 4000);
fetchLive(); fetchSOS();
</script>
</body></html>
