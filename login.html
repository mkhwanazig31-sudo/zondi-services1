<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Welcome - ZONDI</title>
<style>:root{--bg:#F9F7F2;--card:#fff;--ink:#121212;--blue:#2D7FF9;--line:#EDE8E0;--muted:#8A857E}*{box-sizing:border-box;font-family:Inter}body{margin:0;background:var(--bg);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}.box{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.08)}h2{text-align:center;margin:0 0 6px;font-size:28px}p{color:var(--muted);text-align:center;font-size:13px;margin-bottom:20px}input{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:#FFFEFB;margin:8px 0}.btn{width:100%;padding:13px;border-radius:12px;border:none;background:var(--blue);color:#fff;font-weight:700;margin-top:14px;cursor:pointer}.footer{text-align:center;margin-top:24px;color:#999;font-size:10px;letter-spacing:1.2px;text-transform:uppercase}</style></head><body>
<div class="box"><h2>Welcome</h2><p>Login to your area</p>
<div style="display:flex;gap:20px;justify-content:center;margin-bottom:12px;font-size:14px"><span style="font-weight:700;color:var(--blue);border-bottom:2px solid var(--blue)">Login</span><a href="/register" style="color:var(--muted);text-decoration:none">Register</a></div>
<input placeholder="Username / Email" id="u"><input type="password" placeholder="Password" id="p">
<button class="btn" onclick="localStorage.setItem('zondi_user',document.getElementById('u').value||'client');location.href='/clients'">Login</button>
<div class="footer">designed by mkhwanazi.gv — built with autonomous intelligence, directed by human intent</div></div></body></html>
