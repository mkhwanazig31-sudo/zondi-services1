<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register - ZONDI</title>
<style>:root{--bg:#F9F7F2;--card:#fff;--ink:#121212;--blue:#2D7FF9;--gold:#E8B62A;--line:#EDE8E0;--muted:#8A857E}*{box-sizing:border-box;font-family:Inter}body{margin:0;background:var(--bg);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}.box{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.08);text-align:center}h2{margin:0 0 6px}p{color:var(--muted);font-size:13px;margin-bottom:18px}input,select{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:#FFFEFB;margin:8px 0}.btn{width:100%;padding:13px;border-radius:12px;border:none;font-weight:700;margin-top:14px;cursor:pointer}.blue{background:var(--blue);color:#fff}.light{background:var(--card);border:1px solid var(--line);color:var(--ink);margin-top:8px}.footer{text-align:center;margin-top:24px;color:#999;font-size:10px;letter-spacing:1.2px;text-transform:uppercase}</style></head><body>
<div class="box">
<h2>Join ZONDI</h2>
<p>Create your secure account</p>
<input id="name" placeholder="Full name">
<input id="phone" placeholder="Phone or Email">
<input id="pass" type="password" placeholder="Password">
<select id="role"><option value="client">Client</option><option value="patrol">Patrol Officer</option><option value="dev">Control Room</option></select>
<button class="btn blue" id="regBtn" onclick="doReg()">Create account</button>
<button class="btn light" onclick="location.href='/login'">Already have account?</button>
<div id="msg" style="margin-top:12px;font-size:13px;"></div>
<div class="footer">designed by mkhwanazi.gv — built with autonomous intelligence, directed by human intent</div>
</div>
<script>
async function doReg(){
 let btn=document.getElementById('regBtn'); btn.innerText='Creating...'; btn.disabled=true;
 let data={name:document.getElementById('name').value, phone:document.getElementById('phone').value, password:document.getElementById('pass').value, role:document.getElementById('role').value};
 let msg=document.getElementById('msg');
 try{
  let r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
  let j=await r.json();
  msg.style.color='green'; msg.innerText='✅ Account created! Go login';
  setTimeout(()=>location.href='/login',1000);
 }catch(e){ msg.innerText='Server error'; btn.innerText='Create account'; btn.disabled=false}
}
</script>
</body></html>
