<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register - ZONDI</title>
<style>:root{--bg:#F9F7F2;--card:#fff;--blue:#2D7FF9;--line:#EDE8E0;--muted:#8A857E}*{box-sizing:border-box;font-family:Inter}body{margin:0;background:var(--bg);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}.box{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.08)}input,select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);margin:7px 0}.btn{width:100%;padding:13px;border-radius:12px;border:none;background:#E8B62A;color:#000;font-weight:800;margin-top:12px}.footer{text-align:center;margin-top:20px;color:#999;font-size:10px;letter-spacing:1.2px;text-transform:uppercase}</style></head><body>
<div class="box"><h2 style="text-align:center">Create account</h2><p style="text-align:center;color:var(--muted);font-size:13px">Join ZONDI network</p>

<button class="btn" onclick="location.href='/login'">Register</button><div style="text-align:center;margin-top:12px"><a href="/login" style="color:var(--blue);font-size:13px;text-decoration:none">Already have account? Login</a></div>
<div class="footer">designed by mkhwanazi.gv — built with autonomous intelligence, directed by human intent</div></div></body></html>
