<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZONDI</title>
<style>
body{margin:0;background:#F9F7F2;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:Inter, sans-serif}
.box{background:#fff;border:1px solid #EDE8E0;border-radius:24px;padding:28px;width:90%;max-width:360px;text-align:center}
.logo{width:90px;height:90px;border-radius:20px;object-fit:cover;border:1px solid #EDE8E0;margin-bottom:12px}
.btn{width:100%;padding:13px;border-radius:12px;border:none;font-weight:700;margin:8px 0;cursor:pointer}
.blue{background:#2D7FF9;color:#fff}
.light{background:#fff;border:1px solid #EDE8E0;color:#2D2A26}
.about{margin-top:20px;text-align:left;background:#F9F7F2;border-radius:16px;padding:14px;border:1px solid #EDE8E0}
.about img{width:100%;height:140px;object-fit:cover;border-radius:12px;margin-bottom:10px;border:1px solid #EDE8E0}
.about h4{margin:0 0 6px 0;font-size:14px}
.about p{margin:0;color:#8A857E;font-size:12.5px;line-height:1.4}
</style>
</head>
<body>
<div class="box">
<img src="./logo.jpg" class="logo" alt="ZONDI Logo" onerror="this.style.display='none'">
<h2 style="margin:0">ZONDI</h2>
<p style="color:#8A857E;font-size:13px;margin:6px 0 16px 0">Protection Services - Ga-Rankuwa</p>
<button class="btn blue" onclick="location.href='./login.html'">Login</button>
<button class="btn light" onclick="location.href='./register.html'">Create Account</button>

<div class="about">
<img src="./about.jpg" alt="About ZONDI" onerror="this.style.display='none'">
<h4>About Us</h4>
<p>ZONDI is a community patrol & SOS system for Ga-Rankuwa. One tap shares your live location with family & patrol team. Fast response, safety for all.</p>
</div>

</div>
</body>
</html>
